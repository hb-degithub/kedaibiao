[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedaibiao"
version = "0.1.0"
description = "课代表 —— 多平台作业/课程一体化自动化框架"
readme = "README.md"
requires-python = ">=3.11"
# SPDX 表达式（PEP 639）。注意：AGPL-3.0-only 意味着任何并入本项目的
# 第三方代码都必须是 AGPL 兼容的 —— 非商业/附加限制类协议（如 uai-core）不可并入。
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "HB", email = "wzdshb@126.com" }]
keywords = ["automation", "playwright", "framework", "courseware"]

# 核心运行时只依赖标准库，保证骨架可离线导入与自测。
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.47"]
# 听力题转写（iTEST）：本地 faster-whisper，CPU 可跑
stt = ["faster-whisper>=1.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
db = ["sqlalchemy>=2.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
kedaibiao = "kedaibiao.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kedaibiao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["kedaibiao"]
strict = true
warn_unused_ignores = true

# 平台适配器也可以声明成 entry point（装成包发布时用得上）。
# 源码直跑时由 kedaibiao.platforms.load_builtin_adapters() 自动发现，
# 不需要在这里登记 —— 并行开发时改这个文件必然冲突。
[project.entry-points."kedaibiao.adapters"]
unipus = "kedaibiao.platforms.unipus:UnipusAdapter"
