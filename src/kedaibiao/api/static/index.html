<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<!-- 本地工具：禁止一切外部资源与外发请求（无 CDN、无埋点、无远程字体） -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>课代表 kedaibiao · 控制台</title>
<link rel="stylesheet" href="/static/next/app.css?v=20261020b">
</head>
<body>

<!-- 新版（v2）接在 / 。原控制台保留在 /classic（重启后生效），
     重启前也可直接用 /static/v1.html 打开。
     ================================================================== -->
<!-- ==================================================================
     登录：左右分栏（左侧品牌说明 + 右侧表单）。
     令牌由 HttpOnly Cookie 承载，本页不读写 localStorage 里的任何凭据。
     ================================================================== -->
<div id="login" class="login" hidden>
  <div class="login-art">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">课</span>
      <span class="brand-name">课代表</span>
      <span class="brand-slug mono">kedaibiao</span>
    </div>

    <div class="login-pitch">
      <h1>把散落各平台的<br>待办、作业与题库，收进一套界面。</h1>
      <p>统一登录态、统一任务模型、统一提交链路。平台差异关在适配器里，控制台只呈现结果。</p>
      <ul class="login-points">
        <li><span class="n">1</span><span>一条命令栏切换平台与功能，作用域始终可见</span></li>
        <li><span class="n">2</span><span>先干跑再真交：每一步都可回溯，失败写明原因</span></li>
        <li><span class="n">3</span><span>数据按账号隔离，凭据只写不读</span></li>
      </ul>
    </div>

    <span class="login-caption">本地运行 · 零第三方依赖 · 不出网</span>
  </div>

  <div class="login-form-wrap">
    <div class="login-card">
      <h2>登录控制台</h2>
      <p class="sub">会话由 <span class="mono">HttpOnly Cookie</span> 承载，页面不保存令牌。</p>

      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field" for="login-user">
          <span class="field-label">用户名</span>
          <input id="login-user" class="mono" type="text" autocomplete="username"
                 spellcheck="false" required>
        </label>
        <label class="field" for="login-pass">
          <span class="field-label">密码</span>
          <input id="login-pass" class="mono" type="password" autocomplete="current-password" required>
        </label>
        <div class="field-actions">
          <button id="login-submit" class="btn btn-primary btn-block" type="submit">登录</button>
        </div>
      </form>

      <div id="login-err" class="login-err" hidden></div>
      <p id="login-note" class="login-note">登录后所有数据按当前用户隔离；超管可切换「归属」查看他人数据。</p>
    </div>
  </div>
</div>

<!-- 服务未启动 / file:// 直开时的人话提示 -->
<div id="boot" class="banner" role="alert" hidden></div>

<!-- ==================================================================
     应用外壳：顶栏（品牌 + 平台切换 + 环境身份）
               左轨（功能分组）
               主区（页头 / 指标 / 列表 / 检查器）
     ================================================================== -->
<div id="app" class="shell" hidden>

  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="回到概览">
      <span class="brand-mark" aria-hidden="true">课</span>
      <span class="brand-name">课代表</span>
      <span class="brand-slug mono">kedaibiao</span>
    </a>

    <nav id="plat-switch" class="plat-switch" aria-label="平台切换"></nav>

    <div class="top-right">
      <span id="conn" class="conn" title="控制台连接状态">连接中</span>

      <!-- 当前平台的账号切换：换号 = 换 cookie，后续动作都走这个号 -->
      <label id="acct-switch-wrap" class="acct-switch" for="acct-switch" hidden
             title="切换当前平台使用的账号（换号 = 换会话）">
        <span class="acct-switch-label" aria-hidden="true">⇄</span>
        <select id="acct-switch" class="mono" aria-label="切换平台账号"></select>
      </label>

      <!-- 账号信息：点开是你自己登录过的平台账号，可看详情 / 切号 -->
      <div class="acct-info-wrap">
        <button id="acct-info" class="acct-chip" type="button" hidden
                aria-haspopup="dialog" aria-expanded="false" title="查看平台账号详情">
          <span class="dot" aria-hidden="true"></span>
          <span id="acct-info-name" class="acct-info-name">—</span>
          <span id="acct-info-user" class="acct-info-user mono"></span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div id="acct-menu" class="menu-panel" hidden role="dialog"
             aria-label="平台账号"></div>
      </div>

      <button id="theme-btn" class="icon-btn" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button>
      <span id="user-chip" class="user-chip">
        <span id="user-avatar" class="avatar" aria-hidden="true">—</span>
        <span id="user-name" class="mono">—</span>
        <span id="user-role" class="role">—</span>
      </span>
      <button id="logout-btn" class="icon-btn" type="button" title="退出登录" aria-label="退出登录">⏻</button>
      <!-- 手机端：主题 / 身份 / 退出 收进这里，顶栏只留平台与账号 -->
      <button id="more-btn" class="icon-btn" type="button" title="更多"
              aria-label="更多" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <div id="more-menu" class="menu-panel" hidden role="menu" aria-label="更多操作"></div>
    </div>
  </header>

  <nav id="rail" class="rail" aria-label="功能导航"></nav>

  <main id="main" class="main" tabindex="-1"></main>
</div>

<!-- 右侧检查器：详情统一在这里打开，不跳页、不弹窗 -->
<div id="inspector" class="inspector" hidden>
  <div class="inspector-backdrop" data-close="1"></div>
  <aside class="panel-drawer" role="dialog" aria-modal="true" aria-labelledby="inspector-title">
    <div class="drawer-head">
      <div class="drawer-head-main">
        <div id="inspector-title" class="drawer-title">详情</div>
        <div id="inspector-sub" class="drawer-sub"></div>
      </div>
      <button id="inspector-close" class="icon-btn" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div id="inspector-body" class="drawer-body"></div>
    <div id="inspector-foot" class="drawer-foot" hidden></div>
  </aside>
</div>

<!-- 命令面板（⌘K / Ctrl+K）：跳页、切平台、跑常用动作 -->
<div id="palette" class="palette" hidden>
  <div class="palette-box">
    <input id="palette-input" class="palette-input" type="search" autocomplete="off"
           placeholder="跳转到功能或平台…" aria-label="命令面板">
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="/static/next/app.js?v=20261020b"></script>
</body>
</html>
