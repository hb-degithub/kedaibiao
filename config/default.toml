# 课代表默认配置（可提交）
#
# 优先级：内置默认值 < 本文件 < config/local.toml < 环境变量 KEDAIBIAO_*
# 本地覆盖请写 config/local.toml（已被 .gitignore 忽略，不会进版本库）。
#
# 这里刻意把全部条目注释掉：默认值以 src/kedaibiao/config/settings.py 为准，
# 避免两处各写一份默认值后逐渐漂移。需要改动时取消注释即可。

[kedaibiao]

# 运行环境与日志
# env = "dev"
# log_level = "INFO"

# 存储（题库 + 执行留痕）
# db_url = "sqlite:///./data/kedaibiao.db"

# 安全开关：dry_run = true 表示只规划不提交。
# 这是本项目最重要的开关 —— 真提交前请先用干跑确认它打算交什么。
# dry_run = true
# min_confidence = 0.75

# 调度
# max_concurrency = 3
# min_interval = 0.0
# max_attempts = 3

# 浏览器
# headless = true
# session_dir = "./data/sessions"

# 通知
# notify = "console"

# ---- 定时跑批（默认关闭；见 src/kedaibiao/tasks/schedule.py）----
# 打开后，`kedaibiao web` 启动时会拉起后台线程按间隔跑任务，退出时自动停。
# 也可以不用控制台：`kedaibiao schedule --once` 跑一次，或常驻 `kedaibiao schedule`。
#
# [schedule]
# enabled = false          # 整个功能的总开关
# tick = 30.0              # 每 30 秒检查一次有没有任务到期
#
# [[schedule.jobs]]
# name = "unipus-daily"    # 任务名（唯一）
# platform = "unipus"      # 平台机器名，见 `kedaibiao platforms`
# every = "24h"            # s / m / h / d 后缀；纯数字按秒
# live = false             # 默认干跑；写操作必须显式改成 true
# limit = 0                # 0 = 不限
# kinds = ""               # 空 = 全部；或 course,homework,exam,practice
# enabled = true
